<!DOCTYPE html>
<html>
<head>
    <title>Frames Example</title>
</head>
<frameset rows="30%,70%">
    <frame src="top.html" name="topFrame" noresize scrolling="no">
    <frameset cols="30%,70%">
        <frame src="menu.html" name="menuFrame" noresize>
        <frame src="blank.html" name="contentFrame" noresize>
    </frameset>
    <noframes>
        <body>
            Your browser does not support frames.
        </body>
    </noframes>
</frameset>
</html>
