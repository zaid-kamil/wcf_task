<!DOCTYPE html>
<html>
<head>
    <title>Visitor Information Form</title>
</head>
<body>
    <h1>Visitors Information</h1>
    <hr>
    
    <form action="#" method="post">
        <table border="0" cellpadding="5" cellspacing="0">
            <tr>
                <td>Email address:</td>
                <td><input type="email" name="email" required></td>
            </tr>
            
            <tr>
                <td>User's interest:</td>
                <td>
                    <input type="checkbox" name="interest" value="research" id="research">
                    <label for="research">Web for research</label><br>
                    <input type="checkbox" name="interest" value="purchase" id="purchase">
                    <label for="purchase">Purchase</label>
                </td>
            </tr>
            
            <tr>
                <td>Occupation:</td>
                <td>
                    <select name="occupation">
                        <option value="" selected>Select one</option>
                        <option value="student">Student</option>
                        <option value="professional">Professional</option>
                        <option value="business">Business</option>
                        <option value="others">Others</option>
                    </select>
                </td>
            </tr>
            
            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio" name="junk_mail" value="yes" id="yes">
                    <label for="yes">Absolutely</label><br>
                    <input type="radio" name="junk_mail" value="no" id="no">
                    <label for="no">No way man</label>
                </td>
            </tr>
            
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
