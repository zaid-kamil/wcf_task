<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title th:text="${employee.id} != null ? 'Edit Employee' : 'Add New Employee'">Employee Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <h1 th:text="${employee.id} != null ? 'Edit Employee' : 'Add New Employee'"></h1>
            <form th:action="${employee.id} != null ? @{/employees/{id}(id=${employee.id})} : @{/employees/save}" 
                  th:object="${employee}" method="post">
                <div class="mb-3">
                    <label for="firstname" class="form-label">Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" id="firstname" placeholder="Enter First Name" required>
                </div>
                <div class="mb-3">
                    <label for="lastname" class="form-label">Position</label>
                    <input type="text" th:field="*{lastName}" class="form-control" id="lastname" placeholder="Enter Last Name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Salary</label>
                    <input type="number" th:field="*{email}" class="form-control" id="email" placeholder="Enter Email" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
