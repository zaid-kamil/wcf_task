<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            text-align: center;
        }
        table {
            margin: auto;
            border: 1px solid black;
            padding: 20px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h2><b><u>Account Login</u></b></h2>
    <table>
        <tr>
            <td><b>User Name:</b></td>
            <td><input type="text" maxlength="8"></td>
        </tr>
        <tr>
            <td><b>Password:</b></td>
            <td><input type="password" maxlength="8"></td>
        </tr>
        <tr>
            <td colspan="2" style="text-align: center;">
                <button type="submit">Login</button>
            </td>
        </tr>
    </table>
</body>
</html>
