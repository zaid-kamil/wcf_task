<!DOCTYPE html>
<html>
<head>
    <title>Font Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f8f8;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
        }
        .font-example {
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        .agency-fb {
            font-family: "Agency FB", sans-serif;
        }
        .cambria {
            font-family: "Cambria", serif;
        }
        .elephant {
            font-family: "Elephant", serif;
        }
        .times-new-roman {
            font-family: "Times New Roman", serif;
        }
        .arial {
            font-family: "Arial", sans-serif;
        }
    </style>
</head>
<body>
    <h1>Font Examples</h1>
    
    <div class="font-example agency-fb">Agency FB</div>
    <div class="font-example cambria">Cambria</div>
    <div class="font-example elephant">Elephant</div>
    <div class="font-example times-new-roman">Times New Roman</div>
    <div class="font-example arial">Arial</div>
</body>
</html>
