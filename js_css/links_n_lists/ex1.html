<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink Background Colors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }

        h1 {
            color: #333;
        }

        div {
            margin: 20px 0;
        }

        /* Link styling */
        a {
            padding: 8px 16px;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
            color: black;
            font-weight: bold;
        }

        /* Unvisited link */
        a:link {
            background-color: #FF0000;
        }

        /* Visited link */
        a:visited {
            background-color: #FFFF00;
        }

        /* Mouse over link */
        a:hover {
            background-color: #FF00FF;
        }

        /* Selected/Active link (when clicked) */
        a:active {
            background-color: #0000FF;
        }

        .note {
            margin-top: 40px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Hyperlink Background Colors</h1>
