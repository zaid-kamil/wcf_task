<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting with CSS</title>
    <style>
        .formatted-text {
            color: magenta;
            text-align: right;
            text-decoration: underline;
            text-transform: uppercase;
            text-indent: 60px;
        }
    </style>
</head>
<body>
    <div class="formatted-text">
        This is a sample text that demonstrates the following properties:
        text color as magenta, aligned to the right, with underline decoration,
        transformed to uppercase, and with a 60-pixel indent for the first line
        of each paragraph.
    </div>
</body>
</html>
